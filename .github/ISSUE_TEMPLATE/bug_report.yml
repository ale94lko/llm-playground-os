name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider (if applicable)
      options:
        - OpenAI
        - Anthropic
        - Gemini
        - Groq
        - Ollama
        - N/A

  - type: input
    id: version
    attributes:
      label: Browser / OS
      placeholder: "Chrome 120 / Windows 11"
